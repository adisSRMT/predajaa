name: Build Android APK

# Zažene se ročno: zavihek Actions -> Build Android APK -> Run workflow.
# APK je ovoj okoli spletne aplikacije, zato ga NI treba graditi znova, ko spremeniš oprema.js ali kaj drugega v aplikaciji.
on:
  workflow_dispatch:

permissions:
  contents: write   # potrebno, da se APK objavi pod "Releases"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare config
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: node scripts/prepare.mjs

      - name: Create Android project
        run: |
          npx cap add android
          RUN_NUMBER=${{ github.run_number }} python3 native/patch_android.py
          npx cap sync android

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          echo "Built: $UNSIGNED"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          if [ -n "${KS_B64:-}" ] && [ -n "${KS_PASS_SECRET:-}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            KS="$RUNNER_TEMP/release.keystore"
            export KS_PASS="$KS_PASS_SECRET"
            echo "Signing with your own key."
          else
            echo "::warning::No signing secrets found, so the APK is signed with a throw-away key. Later builds cannot update this install (colleagues would have to uninstall first). See APK-INSTRUCTIONS.md, step 2.""
            export KS_PASS="$(openssl rand -hex 16)"
            KS="$RUNNER_TEMP/temp.keystore"
            keytool -genkeypair -keystore "$KS" -alias predaja -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Predaja vozil"
          fi
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias predaja --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out predaja-vozil.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs predaja-vozil.apk

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: predaja-vozil-apk
          path: predaja-vozil.apk

      - name: Publish APK under Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest predaja-vozil.apk \
            --title "Predaja vozil - Android APK" \
            --notes "Namestitvena datoteka za Android. Odpri na telefonu, prenesi predaja-vozil.apk in jo namesti." \
            --target "$GITHUB_SHA"
          {
            echo "### APK je pripravljen"
            echo ""
            echo "Prenos: https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/predaja-vozil.apk"
            echo ""
            echo "Stran z datoteko: https://github.com/${GITHUB_REPOSITORY}/releases/tag/apk-latest"
          } >> "$GITHUB_STEP_SUMMARY"
